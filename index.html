<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stokes' Theorem 3D Interactive Laboratory</title>
    <style>
        :root {
            --primary-blue: #1171bd;
            --primary-green: #2e7d32;
            --panel-bg: #f8f9fa;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 10px;
            color: #222;
            box-sizing: border-box;
        }
        .app-container {
            max-width: 1320px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            padding: 15px;
        }
        header {
            text-align: center;
            margin-bottom: 10px;
            border-bottom: 2px solid #dee2e6;
            padding-bottom: 8px;
        }
        header h1 {
            margin: 0;
            font-size: 26px;
            color: #1a1a1a;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 320px 1fr 340px;
            gap: 12px;
        }
        @media (max-width: 1100px) {
            .main-grid { grid-template-columns: 1fr; }
        }
        .panel {
            background: var(--panel-bg);
            border: 3px solid #ccc;
            border-radius: 6px;
            padding: 12px;
            position: relative;
            margin-bottom: 12px;
        }
        .panel-blue { border-color: #1171bd; }
        .panel-green { border-color: #2e7d32; }
        .panel-yellow { border-color: #d4af37; }

        .panel-title {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            padding: 0 10px;
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
        }
        .status-bar {
            background-color: #ffeb3b;
            text-align: center;
            font-weight: bold;
            font-size: 17px;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 12px;
            border: 2px solid #fbc02d;
        }
        canvas {
            background: #ffffff;
            display: block;
            margin: 0 auto;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }
        .control-group {
            margin: 10px 0;
        }
        .control-group label {
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 4px;
        }
        select, input[type=range] {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
        }
        .result-box {
            background: #fff;
            border: 2px solid #2e7d32;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            text-align: center;
        }
        .result-val {
            font-size: 20px;
            font-weight: bold;
            color: #2e7d32;
            margin: 4px 0;
        }
        textarea {
            width: 100%;
            height: 380px;
            box-sizing: border-box;
            font-size: 12px;
            line-height: 1.5;
            padding: 8px;
            resize: none;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Stokes' Theorem 3D Interactive Laboratory</h1>
        <div style="font-size: 14px; color: #555; margin-top: 3px; font-weight: bold;">Created by Dr Nitin Phadkule</div>
    </header>

    <div id="statusBar" class="status-bar">Verification: ∮ H · dL = ∬ (∇ × H) · dS</div>

    <div class="main-grid">
        <!-- LEFT PANEL: CONTROLS & CALCULATIONS -->
        <div>
            <div class="panel panel-blue">
                <div class="panel-title" style="color: #0671bd;">Controls & Parameters</div>
                
                <div class="control-group">
                    <label>Magnetic Field H:</label>
                    <select id="fieldSelect" onchange="runSimulation()">
                        <option value="1">H = [-y, x, 0] (Uniform Rotation)</option>
                        <option value="2">H = [2y, -x, 0] (Asymmetric Rotation)</option>
                        <option value="3">H = [yz, xz, xy] (Position Dependent)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>3D Surface Geometry:</label>
                    <select id="surfaceSelect" onchange="runSimulation()">
                        <option value="flat">Flat Circular Disk (z = 0)</option>
                        <option value="bowl">Paraboloid Bowl (z = R^2 - x^2 - y^2)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Surface Scale (R): <span id="rVal">1.2</span></label>
                    <input type="range" id="radiusSlider" min="0.5" max="2.0" step="0.1" value="1.2" oninput="runSimulation()">
                </div>

                <div class="control-group">
                    <label>3D View Azimuth Rotation: <span id="azVal">35</span>°</label>
                    <input type="range" id="azSlider" min="0" max="360" step="1" value="35" oninput="runSimulation()">
                </div>

                <div class="control-group">
                    <label>3D View Elevation Tilt: <span id="elVal">25</span>°</label>
                    <input type="range" id="elSlider" min="5" max="85" step="1" value="25" oninput="runSimulation()">
                </div>

                <div class="result-box">
                    <div style="font-size: 12px; font-weight: bold;">Line Integral (∮ H · dL)</div>
                    <div id="lineRes" class="result-val">0.000</div>
                    <hr style="border:0; border-top:1px dashed #ccc; margin:6px 0;">
                    <div style="font-size: 12px; font-weight: bold;">Surface Flux (∬ (∇ × H) · dS)</div>
                    <div id="fluxRes" class="result-val" style="color:#1171bd;">0.000</div>
                </div>
            </div>
        </div>

        <!-- CENTER PANEL: 3D CANVAS VIEWPORT -->
        <div>
            <div class="panel panel-yellow" style="border-color: #666;">
                <div class="panel-title">3D Viewport (Click & Drag to Rotate in 3D)</div>
                <canvas id="canvas3d" width="560" height="460"></canvas>
            </div>
        </div>

        <!-- RIGHT PANEL: CONCEPT GUIDE & EXPLANATION -->
        <div>
            <div class="panel panel-green">
                <div class="panel-title" style="color: #2e7d32;">Stokes Theorem Concept Guide</div>
                <textarea readonly>
1. Fundamental Theorem Equation:
   ∮ H · dL = ∬_S (∇ × H) · dS

2. WHAT IS APPEARING:
   • Red Loop (C): The closed boundary path along which line integral ∮ H · dL is evaluated.
   • Blue Mesh (S): The open 3D surface spanning across the boundary.
   • Green Arrows: Directional vector field lines representing magnetic field H across the surface.

3. WHAT TO CHANGE & OBSERVE:
   • Switch field configurations or surface geometries.
   • Observe that changing the 3D shape from Flat Disk to Paraboloid Bowl alters the surface, yet both numerical results remain identical!
   • Click and drag on the 3D viewport to inspect spatial orientation from any angle.</textarea>
            </div>
        </div>
    </div>
</div>

<script>
    const simCanvas = document.getElementById("canvas3d");
    const sCtx = simCanvas.getContext("2d");

    let isDragging = false;
    let lastMouseX = 0, lastMouseY = 0;

    simCanvas.addEventListener('mousedown', e => {
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
    });

    window.addEventListener('mouseup', () => isDragging = false);

    simCanvas.addEventListener('mousemove', e => {
        if (!isDragging) return;
        let dx = e.clientX - lastMouseX;
        let dy = e.clientY - lastMouseY;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;

        let azSlider = document.getElementById("azSlider");
        let elSlider = document.getElementById("elSlider");

        azSlider.value = (parseFloat(azSlider.value) - dx * 0.5 + 360) % 360;
        elSlider.value = Math.min(85, Math.max(5, parseFloat(elSlider.value) + dy * 0.5));
        
        runSimulation();
    });

    function getField(x, y, z, type) {
        if (type == "1") {
            return { fx: -y, fy: x, fz: 0, curlX: 0, curlY: 0, curlZ: 2 };
        } else if (type == "2") {
            return { fx: 2*y, fy: -x, fz: 0, curlX: 0, curlY: 0, curlZ: -3 };
        } else {
            return { fx: y*z, fy: x*z, fz: x*y, curlX: 0, curlY: 0, curlZ: 0 };
        }
    }

    function runSimulation() {
        let fieldType = document.getElementById("fieldSelect").value;
        let surfType = document.getElementById("surfaceSelect").value;
        let R = parseFloat(document.getElementById("radiusSlider").value);
        let az = parseFloat(document.getElementById("azSlider").value) * Math.PI / 180;
        let el = parseFloat(document.getElementById("elSlider").value) * Math.PI / 180;

        document.getElementById("rVal").innerText = R.toFixed(1);
        document.getElementById("azVal").innerText = Math.round(az * 180 / Math.PI);
        document.getElementById("elVal").innerText = Math.round(el * 180 / Math.PI);

        // Numerical Line Integral ∮ H · dL along boundary curve C
        let N = 300;
        let lineSum = 0;
        for (let i = 0; i < N; i++) {
            let th = (i / N) * 2 * Math.PI;
            let thNext = ((i + 1) / N) * 2 * Math.PI;
            
            let x = R * Math.cos(th);
            let y = R * Math.sin(th);
            let z = (surfType === 'bowl') ? (R*R - x*x - y*y) : 0;

            let xNext = R * Math.cos(thNext);
            let yNext = R * Math.sin(thNext);
            let zNext = (surfType === 'bowl') ? (R*R - xNext*xNext - yNext*yNext) : 0;

            let dx = xNext - x;
            let dy = yNext - y;
            let dz = zNext - z;

            let f = getField(x, y, z, fieldType);
            lineSum += (f.fx * dx + f.fy * dy + f.fz * dz);
        }

        // Numerical Surface Flux Integral ∬ (∇ × H) · dS
        let fluxSum = 0;
        let gridRes = 25;
        let dA = (2 * R / gridRes) * (2 * R / gridRes);

        for (let ix = 0; ix < gridRes; ix++) {
            for (let iy = 0; iy < gridRes; iy++) {
                let x = -R + (ix + 0.5) * (2 * R / gridRes);
                let y = -R + (iy + 0.5) * (2 * R / gridRes);
                if (x*x + y*y <= R*R) {
                    let z = (surfType === 'bowl') ? (R*R - x*x - y*y) : 0;
                    let f = getField(x, y, z, fieldType);

                    let nx = (surfType === 'bowl') ? (2 * x) : 0;
                    let ny = (surfType === 'bowl') ? (2 * y) : 0;
                    let nz = 1.0;

                    fluxSum += (f.curlX * nx + f.curlY * ny + f.curlZ * nz) * dA;
                }
            }
        }

        document.getElementById("lineRes").innerText = lineSum.toFixed(3);
        document.getElementById("fluxRes").innerText = fluxSum.toFixed(3);

        draw3DScene(R, az, el, surfType, fieldType);
    }

    function draw3DScene(R, az, el, surfType, fieldType) {
        sCtx.clearRect(0, 0, simCanvas.width, simCanvas.height);

        let cx = simCanvas.width / 2;
        let cy = simCanvas.height / 2 + 10;
        let scale = 110;

        let cosAz = Math.cos(az), sinAz = Math.sin(az);
        let cosEl = Math.cos(el), sinEl = Math.sin(el);

        function project(x, y, z) {
            let x1 = x * cosAz - y * sinAz;
            let y1 = x * sinAz + y * cosAz;
            let z1 = z;

            let x2 = x1;
            let y2 = y1 * cosEl - z1 * sinEl;
            let z2 = y1 * sinEl + z1 * cosEl;

            return {
                px: cx + x2 * scale,
                py: cy - y2 * scale,
                depth: z2
            };
        }

        // Draw Coordinate Axes
        let o = project(0,0,0);
        let axX = project(2.2, 0, 0);
        let axY = project(0, 2.2, 0);
        let axZ = project(0, 0, 2.2);

        sCtx.lineWidth = 1.5;
        sCtx.strokeStyle = "#aaa";
        
        sCtx.beginPath(); sCtx.moveTo(o.px, o.py); sCtx.lineTo(axX.px, axX.py); sCtx.stroke();
        sCtx.beginPath(); sCtx.moveTo(o.px, o.py); sCtx.lineTo(axY.px, axY.py); sCtx.stroke();
        sCtx.beginPath(); sCtx.moveTo(o.px, o.py); sCtx.lineTo(axZ.px, axZ.py); sCtx.stroke();

        sCtx.fillStyle = "#333";
        sCtx.font = "bold 12px Arial";
        sCtx.fillText("X", axX.px + 4, axX.py);
        sCtx.fillText("Y", axY.px + 4, axY.py);
        sCtx.fillText("Z", axZ.px, axZ.py - 4);

        // Draw 3D Surface Mesh (Open Surface S)
        let steps = 16;
        for (let i = 0; i < steps; i++) {
            let r1 = (i / steps) * R;
            let r2 = ((i + 1) / steps) * R;
            let segs = 20;

            for (let j = 0; j < segs; j++) {
                let th1 = (j / segs) * 2 * Math.PI;
                let th2 = ((j + 1) / segs) * 2 * Math.PI;

                let p1 = {x: r1*Math.cos(th1), y: r1*Math.sin(th1), z: (surfType==='bowl')?(R*R - (r1*r1)):0};
                let p2 = {x: r2*Math.cos(th1), y: r2*Math.sin(th1), z: (surfType==='bowl')?(R*R - (r2*r2)):0};
                let p3 = {x: r2*Math.cos(th2), y: r2*Math.sin(th2), z: (surfType==='bowl')?(R*R - (r2*r2)):0};
                let p4 = {x: r1*Math.cos(th2), y: r1*Math.sin(th2), z: (surfType==='bowl')?(R*R - (r1*r1)):0};

                let proj1 = project(p1.x, p1.y, p1.z);
                let proj2 = project(p2.x, p2.y, p2.z);
                let proj3 = project(p3.x, p3.y, p3.z);
                let proj4 = project(p4.x, p4.y, p4.z);

                sCtx.beginPath();
                sCtx.moveTo(proj1.px, proj1.py);
                sCtx.lineTo(proj2.px, proj2.py);
                sCtx.lineTo(proj3.px, proj3.py);
                sCtx.lineTo(proj4.px, proj4.py);
                sCtx.closePath();
                sCtx.fillStyle = "rgba(17, 113, 189, 0.15)";
                sCtx.fill();
                sCtx.strokeStyle = "rgba(17, 113, 189, 0.35)";
                sCtx.stroke();
            }
        }

        // Draw Magnetic Field H Vector Lines with Directional Arrowheads
        sCtx.strokeStyle = "#2e7d32";
        sCtx.fillStyle = "#2e7d32";
        sCtx.lineWidth = 1.5;
        let vGrid = 5;
        for (let gx = -vGrid; gx <= vGrid; gx += 2) {
            for (let gy = -vGrid; gy <= vGrid; gy += 2) {
                let x = (gx / vGrid) * R * 0.85;
                let y = (gy / vGrid) * R * 0.85;
                if (x*x + y*y <= R*R * 0.9) {
                    let z = (surfType === 'bowl') ? (R*R - x*x - y*y) : 0;
                    let f = getField(x, y, z, fieldType);
                    let start = project(x, y, z);
                    let end = project(x + f.fx * 0.18, y + f.fy * 0.18, z + f.fz * 0.18);

                    // Draw Line Stem
                    sCtx.beginPath();
                    sCtx.moveTo(start.px, start.py);
                    sCtx.lineTo(end.px, end.py);
                    sCtx.stroke();

                    // Draw Directional Arrowhead
                    let angle = Math.atan2(end.py - start.py, end.px - start.px);
                    sCtx.beginPath();
                    sCtx.moveTo(end.px, end.py);
                    sCtx.lineTo(end.px - 6 * Math.cos(angle - Math.PI / 6), end.py - 6 * Math.sin(angle - Math.PI / 6));
                    sCtx.lineTo(end.px - 6 * Math.cos(angle + Math.PI / 6), end.py - 6 * Math.sin(angle + Math.PI / 6));
                    sCtx.closePath();
                    sCtx.fill();
                }
            }
        }

        // Draw Boundary Curve C (Bold Red Loop)
        sCtx.strokeStyle = "#cc0000";
        sCtx.lineWidth = 4;
        sCtx.beginPath();
        let loopSteps = 100;
        for (let i = 0; i <= loopSteps; i++) {
            let th = (i / loopSteps) * 2 * Math.PI;
            let x = R * Math.cos(th);
            let y = R * Math.sin(th);
            let z = (surfType === 'bowl') ? (R*R - x*x - y*y) : 0;
            let pt = project(x, y, z);
            if (i === 0) sCtx.moveTo(pt.px, pt.py);
            else sCtx.lineTo(pt.px, pt.py);
        }
        sCtx.stroke();
    }

    runSimulation();
</script>
</body>
</html>
